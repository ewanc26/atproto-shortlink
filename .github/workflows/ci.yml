name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATPROTO_DID: did:plc:aaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm test
      - run: pnpm build
